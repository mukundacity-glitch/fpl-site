name: Apply final chip-rule fixes

on:
  push:
    branches: [fpl-vortex-review]
    paths:
      - ".github/workflows/apply-final-chip-rules.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified 2026/27 chip restrictions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/build_data_json.py',
              '    free_hit = max(windows, key=lambda window: window["blanks"] * 3 + window["doubles"] * 2 + window["easy_teams"] * 0.35)\n',
              '    free_hit_windows = [window for window in windows if window["gw"] != 1]\n    if not free_hit_windows:\n        free_hit_windows = windows\n    free_hit = max(free_hit_windows, key=lambda window: window["blanks"] * 3 + window["doubles"] * 2 + window["easy_teams"] * 0.35)\n'
          )

          replace_once(
              'scripts/build_data_json.py',
              '"chip_rules": {"season": "2026/27", "chips": ["Wildcard", "Free Hit", "Bench Boost", "Triple Captain"], "sets": 2, "first_set_expires_after_gw": 19, "second_set_starts_gw": 20, "one_chip_per_gameweek": True},',
              '"chip_rules": {"season": "2026/27", "chips": ["Wildcard", "Free Hit", "Bench Boost", "Triple Captain"], "sets": 2, "first_set_expires_after_gw": 19, "second_set_starts_gw": 20, "one_chip_per_gameweek": True, "wildcard_not_allowed_gw1": True, "free_hit_not_allowed_gw1": True, "free_hit_not_consecutive": True},'
          )

          replace_once(
              'index.html',
              "if(available.includes('Free Hit'))for(const g of gs){const opt=optimize(p=>pAt(p,g),budget)",
              "if(available.includes('Free Hit'))for(const g of gs){if(g===1||(g>1&&(raw.history?.chips||[]).some(x=>n(x.event)===g-1&&chipName(x.name)==='Free Hit')))continue;const opt=optimize(p=>pAt(p,g),budget)"
          )

          replace_once(
              'index.html',
              '<b>2026/27:</b> Wildcard, Free Hit, Bench Boost and Triple Captain are each available once in each half. First-half chips expire after GW19; second set starts GW20; one chip per Gameweek.',
              '<b>2026/27:</b> Wildcard, Free Hit, Bench Boost and Triple Captain are each available once in each half. First-half chips expire after GW19; second set starts GW20; one chip per Gameweek. Wildcard and Free Hit cannot be played in GW1, and Free Hit cannot be used in consecutive Gameweeks.'
          )

          replace_once(
              'README.md',
              '- Only one chip can be played in a Gameweek.\n',
              '- Only one chip can be played in a Gameweek.\n- Wildcard and Free Hit cannot be played in Gameweek 1.\n- Free Hit cannot be played in consecutive Gameweeks; using the first Free Hit in GW19 blocks the second in GW20.\n'
          )

          replace_once(
              'scripts/validate_data.py',
              'assert chips.get("one_chip_per_gameweek") is True\n',
              'assert chips.get("one_chip_per_gameweek") is True\nassert chips.get("wildcard_not_allowed_gw1") is True\nassert chips.get("free_hit_not_allowed_gw1") is True\nassert chips.get("free_hit_not_consecutive") is True\n'
          )

          Path('.github/workflows/apply-final-chip-rules.yml').unlink()
          print('Applied official 2026/27 chip restrictions and removed one-time patch workflow.')
          PY
      - name: Verify patched source
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/validate_frontend.py
          grep -q 'free_hit_not_consecutive' scripts/build_data_json.py
          grep -q 'Free Hit cannot be played in consecutive Gameweeks' README.md
      - name: Commit final rule fixes
        run: |
          git config user.name "FPL Vortex Setup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce official 2026/27 chip restrictions"
          git push
