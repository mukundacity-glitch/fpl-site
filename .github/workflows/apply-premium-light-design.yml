name: Apply premium light design

on:
  push:
    branches: [fpl-vortex-review]
    paths:
      - .github/workflows/apply-premium-light-design.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install premium Step 1 homepage
        env:
          FPL_VORTEX_INDEX_GZ_B64: 
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          payload = gzip.decompress(base64.b64decode(os.environ['FPL_VORTEX_INDEX_GZ_B64']))
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'be6f9d9dbe425a0ac58936eed02aa7f31501550e2f60b7106998454de40fa565'
          if digest != expected:
              raise SystemExit(f'index payload checksum mismatch: {digest}')
          open('index.html','wb').write(payload)
          PY
      - name: Validate premium frontend
        run: |
          python3 scripts/validate_frontend.py
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = ['Plus Jakarta Sans','Make every Gameweek decision with clarity.','Today’s decision board','FPL Vortex Intelligence','#f6f8f7']
          for item in required:
              assert item in html, f'missing premium design marker: {item}'
          print('premium Step 1 markers verified')
          PY
      - name: Commit premium Step 1 and remove installer
        run: |
          git config user.name "FPL Vortex Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-premium-light-design.yml
          git add index.html
          git commit -m "feat: premium light homepage redesign"
          git push
