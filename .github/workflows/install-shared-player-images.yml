name: Install shared player image service

on:
  push:
    branches: [fpl-vortex-review]
    paths:
      - ".github/workflows/install-shared-player-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fpl-vortex-review
      - name: Wire shared image service across all views
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          css_line = '<link rel="stylesheet" href="assets/player-images.css">'
          if css_line not in text:
              text = text.replace('<link rel="stylesheet" href="assets/my-team-planner.css">', '<link rel="stylesheet" href="assets/my-team-planner.css">\n' + css_line)
          script_line = '<script src="assets/player-images.js"></script>'
          if script_line not in text:
              text = text.replace('<script src="assets/dashboard-premium.js"></script>', script_line + '\n<script src="assets/dashboard-premium.js"></script>')
          old = 'const playerPhoto=p=>p?.photo_code?`https://resources.premierleague.com/premierleague/photos/players/250x250/p${encodeURIComponent(p.photo_code)}.png`:"";'
          new = 'const playerPhoto=p=>window.FPLVortexImages?.primaryUrl(p)||(p?.photo_code?`https://resources.premierleague.com/premierleague/photos/players/250x250/p${encodeURIComponent(p.photo_code)}.png`:"");'
          text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          premium = Path('assets/dashboard-premium.js')
          text = premium.read_text(encoding='utf-8')
          old = 'const pvLegacyPlayer=p=>p?.photo_code?`https://resources.premierleague.com/premierleague/photos/players/250x250/p${encodeURIComponent(p.photo_code)}.png`:"";'
          new = 'const pvLegacyPlayer=p=>window.FPLVortexImages?.primaryUrl(p)||(p?.photo_code?`https://resources.premierleague.com/premierleague/photos/players/250x250/p${encodeURIComponent(p.photo_code)}.png`:"");'
          text = text.replace(old, new)
          premium.write_text(text, encoding='utf-8')

          v4 = Path('assets/dashboard-v4.js')
          text = v4.read_text(encoding='utf-8')
          text = re.sub(r'function photoUrls\(p\)\{.*?\n\}', 'function photoUrls(p){\n  return window.FPLVortexImages?.urls(p?.photo_code)||[];\n}', text, count=1, flags=re.S)
          v4.write_text(text, encoding='utf-8')

          planner = Path('assets/my-team-planner.js')
          text = planner.read_text(encoding='utf-8')
          text = re.sub(r'function mtPhotoUrls\(p\)\{.*?\}\n', 'function mtPhotoUrls(p){return window.FPLVortexImages?.urls(p?.photo_code)||[];}\n', text, count=1, flags=re.S)
          planner.write_text(text, encoding='utf-8')
          PY
      - name: Validate frontend and image service
        run: |
          node --check assets/player-images.js
          node --check assets/dashboard-premium.js
          node --check assets/dashboard-v4.js
          node --check assets/my-team-planner.js
          python3 scripts/validate_frontend.py
          grep -q 'assets/player-images.js' index.html
          grep -q 'assets/player-images.css' index.html
          grep -q 'FPLVortexImages' assets/dashboard-premium.js
          grep -q 'FPLVortexImages' assets/dashboard-v4.js
          grep -q 'FPLVortexImages' assets/my-team-planner.js
      - name: Commit installation
        run: |
          set -euo pipefail
          rm .github/workflows/install-shared-player-images.yml
          git config user.name "FPL Vortex Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/dashboard-premium.js assets/dashboard-v4.js assets/my-team-planner.js .github/workflows/install-shared-player-images.yml
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: use shared official player image service site-wide"
          git push
