name: Refresh complete FPL player pool

on:
  push:
    branches: [fpl-vortex-review]
    paths:
      - ".github/workflows/refresh-full-player-pool.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fpl-vortex-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and refresh all automated data
        run: |
          python3 scripts/validate_frontend.py
          python3 -m unittest discover -s tests -p "test_*.py" -v
          python3 scripts/fetch_fpl_api.py
          python3 scripts/update_data.py
          python3 scripts/collect_price_history.py
          python3 scripts/collect_accuracy.py
          python3 scripts/build_data_json.py
          python3 scripts/validate_data.py
      - name: Commit refreshed full player pool
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-full-player-pool.yml
          git config user.name "FPL Vortex Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json data/ .github/workflows/refresh-full-player-pool.yml
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore(data): refresh complete official FPL player pool"
          git push
