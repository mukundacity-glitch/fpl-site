name: Upgrade premium dashboard v3

on:
  push:
    branches: [fpl-vortex-review]
    paths: [".github/workflows/upgrade-dashboard-v3.yml"]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fpl-vortex-review
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply premium dashboard and data metadata
        env:
          CSS_Z: ""
          JS_Z: ""
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, os, zlib

          root=Path('.')
          assets=root/'assets'
          assets.mkdir(exist_ok=True)
          (assets/'dashboard-premium.css').write_bytes(zlib.decompress(base64.b64decode(os.environ['CSS_Z'])))
          (assets/'dashboard-premium.js').write_bytes(zlib.decompress(base64.b64decode(os.environ['JS_Z'])))

          p=root/'index.html'
          s=p.read_text(encoding='utf-8')
          if 'assets/dashboard-premium.css' not in s:
              s=s.replace('</head>', '<link rel="stylesheet" href="assets/dashboard-premium.css">\n</head>')
          if 'assets/dashboard-premium.js' not in s:
              s=s.replace('</body>', '<script src="assets/dashboard-premium.js"></script>\n</body>')
          s=s.replace('family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap', 'family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap')
          p.write_text(s, encoding='utf-8')

          p=root/'scripts/build_data_json.py'
          s=p.read_text(encoding='utf-8')
          event_line='            events.append({"gw": int(event["id"]), "name": event.get("name") or f"Gameweek {event[\'id\']}", "deadline": event.get("deadline_time"), "finished": bool(event.get("finished"))})'
          if event_line in s and 'events[-1].update({"average_entry_score"' not in s:
              s=s.replace(event_line, event_line+'\n            events[-1].update({"average_entry_score": event.get("average_entry_score"), "highest_score": event.get("highest_score")})')
          diff_line='            difficulty.update({"opp": code2short[opponent], "h": is_home, "fdr": difficulty["fdr_all"], "event": int(event)})'
          if diff_line in s and 'difficulty["kickoff"]' not in s:
              s=s.replace(diff_line, diff_line+'\n            difficulty["kickoff"] = fixture.get("kickoff_time")')
          team_line='    teams_out.append({"team": team["short"], "name": team["name"], "fixtures": team_fx[team["code"]], "avg": round(sum(fixture["fdr_all"] for fixture in flat) / len(flat), 2) if flat else None})'
          if team_line in s and 'teams_out[-1].update({"id"' not in s:
              s=s.replace(team_line, team_line+'\n    teams_out[-1].update({"id": int(team["id"]), "code": team["code"]})')
          s=s.replace('"photo_code": str(element.get("photo") or element.get("code") or "").split(".")[0]', '"photo_code": str(element.get("code") or element.get("photo") or "").split(".")[0]')
          s=s.replace('"photo_code": str(meta.get("photo") or meta.get("code") or "").split(".")[0]', '"photo_code": str(meta.get("player_code") or meta.get("code") or meta.get("photo") or "").split(".")[0]')
          lines=s.splitlines()
          out=[]
          for line in lines:
              out.append(line)
              if 'players.append({"id": int(element["id"])' in line and 'players[-1].update({"total_points": int(num(element.get("total_points")))' not in s:
                  out.append('        players[-1].update({"total_points": int(num(element.get("total_points"))), "minutes": int(num(element.get("minutes"))), "starts": int(num(element.get("starts"))), "goals_scored": int(num(element.get("goals_scored"))), "assists": int(num(element.get("assists"))), "clean_sheets": int(num(element.get("clean_sheets"))), "bonus": int(num(element.get("bonus"))), "transfers_in": int(num(element.get("transfers_in_event"))), "transfers_out": int(num(element.get("transfers_out_event")))})')
              if 'players.append({"id": int(float(stat["id"]))' in line and 'players[-1].update({"total_points": int(num(stat.get("total_points")))' not in s:
                  out.append('        players[-1].update({"total_points": int(num(stat.get("total_points"))), "minutes": int(num(stat.get("minutes"))), "starts": int(num(stat.get("starts"))), "goals_scored": int(num(stat.get("goals_scored"))), "assists": int(num(stat.get("assists"))), "clean_sheets": int(num(stat.get("clean_sheets"))), "bonus": int(num(stat.get("bonus"))), "transfers_in": int(num(stat.get("transfers_in_event"))), "transfers_out": int(num(stat.get("transfers_out_event")))})')
          p.write_text('\n'.join(out)+'\n', encoding='utf-8')

          p=root/'functions/api/manager.js'
          s=p.read_text(encoding='utf-8')
          needle='    const picks = await fetchFpl(`/entry/${entry}/event/${currentGw}/picks/`);'
          if needle in s and 'const live = await fetchFpl' not in s:
              s=s.replace(needle, needle+'\n    const live = await fetchFpl(`/event/${currentGw}/live/`);')
              s=s.replace('JSON.stringify({ entry: Number(entry), gw: currentGw, summary, history, picks })','JSON.stringify({ entry: Number(entry), gw: currentGw, summary, history, picks, live })')
          p.write_text(s, encoding='utf-8')

          p=root/'scripts/review_server.py'
          s=p.read_text(encoding='utf-8')
          needle='            picks = fetch_json(f"/entry/{entry}/event/{current_gw}/picks/")'
          if needle in s and 'live = fetch_json' not in s:
              s=s.replace(needle, needle+'\n            live = fetch_json(f"/event/{current_gw}/live/")')
              s=s.replace('                    "picks": picks,\n','                    "picks": picks,\n                    "live": live,\n')
          p.write_text(s, encoding='utf-8')

          p=root/'scripts/validate_frontend.py'
          s=p.read_text(encoding='utf-8')
          if 'assets/dashboard-premium.css' not in s:
              s=s.replace('    "data.json",\n','    "data.json",\n    "assets/dashboard-premium.css",\n    "assets/dashboard-premium.js",\n')
          if 'ROOT / "assets" / "dashboard-premium.js"' not in s:
              s=s.replace('    subprocess.run(["node", "--check", str(ROOT / "functions" / "api" / "manager.js")], check=True)','    subprocess.run(["node", "--check", str(ROOT / "functions" / "api" / "manager.js")], check=True)\n    subprocess.run(["node", "--check", str(ROOT / "assets" / "dashboard-premium.js")], check=True)')
          p.write_text(s, encoding='utf-8')
          PYCODE
      - name: Validate premium frontend
        run: |
          python3 scripts/validate_frontend.py
          python3 -m py_compile scripts/review_server.py scripts/build_data_json.py
          python3 scripts/build_data_json.py
          python3 scripts/validate_data.py
      - name: Commit upgrade
        run: |
          set -euo pipefail
          rm .github/workflows/upgrade-dashboard-v3.yml
          git config user.name "FPL Vortex Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/dashboard-premium.css assets/dashboard-premium.js scripts/build_data_json.py scripts/review_server.py scripts/validate_frontend.py functions/api/manager.js data.json .github/workflows/upgrade-dashboard-v3.yml
          git commit -m "feat: premium live dashboard with player images and model panels"
          git push
