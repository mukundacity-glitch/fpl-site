<style>

  --navy:#0c2630;--purple:#5c2b72;--shadow:0 8px 28px rgba(18,42,53,.08);--shadow-lg:0 18px 55px rgba(18,42,53,.10);

}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:1760px;margin:auto;padding:0 14px 60px}
.site-header{position:sticky;top:0;z-index:60;margin:0 -14px;background:linear-gradient(102deg,#ffffff 0%,#f4feff 35%,#c9f6fb 68%,#69dce9 100%);border-bottom:1px solid #c9e7ec;box-shadow:0 4px 20px rgba(14,91,105,.09)}.header-inner{max-width:1760px;margin:auto;min-height:88px;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand-button{border:0;background:transparent;padding:0;display:flex;align-items:center}.brand-logo{width:300px;height:68px;object-fit:contain;object-position:left center;filter:drop-shadow(0 5px 11px rgba(0,0,0,.12))}.header-actions{display:flex;align-items:center;gap:10px}.my-team-btn{border:0;background:linear-gradient(135deg,var(--red),#ff5a57);color:white;border-radius:999px;padding:13px 24px;font-weight:800;font-size:.9rem;box-shadow:0 8px 24px rgba(239,51,64,.28);transition:.18s ease}.my-team-btn:hover{transform:translateY(-1px);box-shadow:0 11px 28px rgba(239,51,64,.34)}

.notice{border:1px solid #ead9a0;background:#fffaf0;color:#705b14;padding:12px 14px;border-radius:12px;margin:0 0 12px;font-size:.8rem}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:4px 0 12px}.section-title{font-size:1.32rem;font-weight:800;letter-spacing:-.03em}.section-sub{color:var(--muted);font-size:.8rem;margin-top:3px}
.dashboard-grid{display:grid;grid-template-columns:1.35fr .82fr .82fr;gap:12px;align-items:stretch}.dashboard-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}.dash-panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:0}.panel-head{height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:.95rem;background:linear-gradient(180deg,#fff,#fbfdfe)}.panel-head small{font-size:.7rem;color:var(--muted);font-weight:700}.panel-body{padding:12px}.panel-link{border:0;background:transparent;color:var(--cyan-deep);font-size:.74rem;font-weight:800;padding:0}.pitch{background:linear-gradient(180deg,#08ae68,#05c875);border-radius:12px;padding:10px;min-height:408px;position:relative;overflow:hidden}.pitch:before{content:"";position:absolute;inset:12px;border:2px solid rgba(255,255,255,.82);border-radius:6px}.pitch:after{content:"";position:absolute;left:50%;top:12px;bottom:12px;width:2px;background:rgba(255,255,255,.72);transform:translateX(-50%)}.pitch-row{position:relative;z-index:2;display:flex;justify-content:space-evenly;gap:5px;margin:8px 0}.pitch-player{width:88px;text-align:center}.pitch-img-wrap{width:58px;height:58px;margin:auto;border-radius:13px 13px 6px 6px;background:rgba(255,255,255,.18);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}.pitch-img{width:62px;height:62px;object-fit:contain;object-position:center bottom}.pitch-name{background:#fff;color:#351142;border-radius:6px 6px 0 0;padding:4px 4px 3px;font-size:.62rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitch-score{background:#4a1158;color:#fff;border-radius:0 0 6px 6px;padding:2px 4px;font-size:.6rem;font-weight:800}.pitch-fallback{font-size:.75rem;color:#fff;font-weight:800;padding-bottom:12px}.bench-bar{position:relative;z-index:2;border-top:1px solid rgba(25 .fixture-list,.rank-list,.injury-list,.transfer-list{display:grid}.fixture-row,.rank-row,.injury-row,.transfer-row{display:grid;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:48px}.fixture-row:last-child,.rank-row:last-child,.injury-row:last-child,.transfer-row:last-child{border-bottom:0}.fixture-row{grid-template-columns:1fr 30px 52px 30px 1fr;font-size:.76rem}.fixture-home{text-align:right;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fixture-away{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kickoff{background:#f6f7f9;border:1px solid var(--line);border-radius:8px;padding:5px 3px;text-align:center;font-size:.67rem;font-weight:800;color:#433047}.club-badge{width:28px;height:28px;object-fit:contain;display:block}.club-badge.sm{width:24px;height:24px}.club-badge.xs{width:20px;height:20px}.badge-fallback{width:28px;height:28px;border-radius:8px;background:#eef4f6;display:grid;place-items:center;font-size:.55rem;font-weight:800;color:#51626a}.attack-row{display:grid;grid-template-columns:28px 1fr 1.5fr;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.76rem}.attack-row:last-child{border-bottom:0}.attack-meta{min-width:0}.attack-team{font-weight:800}.attack-fixture{font-size:.64rem;color:var(--muted);margin-top:1px}.attack-bar{position:relative;height:31px;border-radius:5px;background:#eef4fa;overflow:hidden}.attack-fill{height:100%;background:linear-gradient(90deg,#1265b8,#2895ee);min-width:14%}.attack-value{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#fff;font-weight:800;font-size:.72rem;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.rank-row{grid-template-columns:26px 44px 1fr minmax(90px,.85fr);min-height:55px}.rank-no{font-weight:800;text-align:center;font-size:.78rem}.player-thumb{width:42px;height:42px;border-radius:10px;background:#e8f3f8;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}.player-thumb img{width:44px;height:44px;object-fit:contain;object-position:center bottom}.player-fallback{font-size:.65rem;font-weight:800;color:#55717d;padding-bottom:12px}.rank-info,.transfer-info,.injury-info{min-width:0}.rank-name,.transfer-name,.injury-name{font-weight:800;color:#087a9c;font-size:.79rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-meta,.transfer-meta,.injury-meta{font-size:.63rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-cell{height:34px;background:#edf4fb;border-radius:3px;position:relative;overflow:hidden}.bar-cell>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#176dc1,#268fe9)}.bar-cell>b{position:relative;z-index:2;color:#fff;font-size:.74rem;line-height:34px;padding-left:8px}.transfer-row{grid-template-columns:44px 1fr 74px 70px;min-height:56px}.pressure-up{color:var(--green);font-weight:800}.pressure-down{color:var(--red);font-weight:800}.net-pos{color:var(--green);font-weight:800}.net-neg{color:var(--red);font-weight:800}.injury-row{grid-template-columns:44px 1fr 22px;min-height:56px}.warning{color:#f1a600;font-size:1rem}.pagination-note{text-align:center;color:var(--muted);font-size:.7rem;padding:9px 0 0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{grid-column:span 4;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:1/-1}.label{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.metric{font-size:1.55rem;font-weight:800;letter-spacing:-.04em;margin-top:6px}.player-name{font-size:1.12rem;font-weight:800;letter-spacing:-.025em}.player-meta{font-size:.73rem;color:var(--muted);margin-top:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.start{align-items:flex-start}.avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(145deg,#ecf7fb,#d9eef5);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:0 0 auto}.avatar img{width:52px;height:52px;object-fit:contain;object-position:center bottom}.avatar-fallback{font-size:.7rem;font-weight:800;color:#4f6974;padding-bottom:14px}.player-line{display:flex;align-items:center;gap:10px}.score{font-size:1.55rem;font-weight:800}.score small{font-size:.65rem;color:var(--muted);font-weight:700}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:12px 0}.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:.68rem;font-weight:800;color:#586661;background:#fff}.chip.green{background:var(--green-soft);border-color:#cceadc;color:#0c7650}.chip.gold{background:var(--gold-soft);border-color:#efdfae;color:#8e6500}.chip.cyan{background:var(--cyan-soft);border-color:#c9ecf0;color:#087b8d}.chip.red{background:var(--red-soft);border-color:#f3c8cc;color:#ac2832}.chips{display:flex;gap:6px;flex-wrap:wrap}.mini-list{display:grid}.mini-item{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.mini-item:last-child{border-bottom:0}.mini-left{display:flex;align-items:center;gap:9px;min-width:0}.value-positive{color:var(--green);font-weight:800}.value-negative{color:var(--red);font-weight:800}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:800;font-size:.76rem;cursor:pointer}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.soft{background:var(--cyan-soft);border-color:#c8e9ee;color:#07798b}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}table{width:100%;border-collapse:collapse;min-width:760px;font-size:.77rem}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:.63rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:#f6f9fa;position:sticky;top:0}tr:last-child td{border-bottom:0}.fdr{display:inline-flex;min-width:54px;justify-content:center;padding:4px 6px;border-radius:7px;font-weight:800;color:#111}.input-row{display:flex;gap:8px;margin-top:12px}.input-row input{flex:1;min-width:170px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 11px;border-radius:10px}.empty{background:#fff;border:1px dashed #cbd7d2;border-radius:16px;padding:32px 18px;text-align:center;color:var(--muted)}.hub-links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hub-link{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px;text-align:left}.hub-link b{display:block;margin-bottom:3px}.subtopics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.subtopic{background:#f7fbfc;border:1px solid #d8e9ed;border-radius:999px;padding:7px 10px;font-size:.69rem;font-weight:800;color:#3d5a64}footer{margin-top:26px;padding:18px 2px;border-top:1px solid var(--line);font-size:.7rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:var(--cyan-deep)}
@media(max-width:1180px){.dashboard-grid{grid-template-columns:1fr 1fr}.dashboard-grid>.dash-panel:first-child{grid-column:1/-1}.dashboard-row{grid-template-columns:1fr 1fr}.dashboard-row>.dash-panel:last-child{grid-column:1/-1}.hub-links{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.app{padding:0 10px 46px}.site-header{margin:0 -10px}.header-inner{min-height:72px;padding:8px 12px}.brand-logo{width:220px;height:54px}.my-team-btn{padding:10px 16px}.product-nav-shell{top:73px;margin:0 -10px}.product-nav{padding:7px 10px}.intelligence-strip{margin-top:12px;padding:12px 14px;display:block}.intelligence-kicker{display:block;margin-bottom:5px}.intelligence-title{white-space:normal;font-size:1.25rem}.intelligence-sub{display:none}.dashboard-grid,.dashboard-row{grid-template-columns:1fr}.dashboard-grid>.dash-panel:first-child,.dashboard-row>.dash-panel:last-child{grid-column:auto}.pitch{min-height:375px}.pitch-player{width:72px}.pitch-img-wrap{width:52px;height:52px}.pitch-img{width:55px;height:55px}.card,.s6,.s8{grid-column:1/-1}.hub-links{grid-template-columns:1fr}.section-title{font-size:1.17rem}}

<body>
<div class="app">
  <header class="site-header">
    <div class="header-inner">
      <button class="brand-button" data-go="overview" aria-label="FPL Vortex dashboard"><img class="brand-logo" src="assets/fpl-vortex-logo.jpg" alt="FPL Vortex"></button>
      <div class="header-actions"><button class="my-team-btn" data-go="manager">My Team</button></div>
    </div>
  </header>

  <div class="product-nav-shell"><nav class="product-nav" id="tabs" aria-label="FPL Vortex tools"></nav></div>

  <section class="intelligence-strip">
    <span class="intelligence-kicker">FPL Vortex Intelligence</span>
    <strong class="intelligence-title">Make every Gameweek decision with clarity.</strong>
    <span class="intelligence-sub">Automatic data · visual analysis · decision tools</span>
  </section>

  <div id="notice"></div>
  <main id="view"><div class="empty">Loading FPL Vortex data…</div></main>
  <footer><span>FPL Vortex · independent FPL analysis · not affiliated with the Premier League.</span><span id="footerUpdated">Waiting for dataset…</span></footer>
</div>
<script>
"use strict";
const TABS=[
  ["fixtures","Fixtures","⚽"],["plan","Team Planner","↔"],["prices","Price Changes","£"],["players","Player Analytics","◫"],
  ["teams","Team Statistics","◉"],["leagues","Leagues","🏆"],["manager","Manager Report","▦"],["preseason","Preseason","★"],
  ["tools","Tools","◈","new"],["blog","Blog","✎"]
];
let D=null,currentTab="overview",fdrKey="fdr",M=null;
const $=id=>document.getElementById(id);
const n=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>`£${n(v).toFixed(1)}m`;
const players=()=>[...(D?.players||[])];
const topPlayers=()=>players().sort((a,b)=>n(b.xpts)-n(a.xpts));
const pAt=(p,gw)=>n((p?.projections||[]).find(x=>n(x.gw)===n(gw))?.xpts);
const gws=()=>[...(D?.events||[])].map(x=>n(x.gw)).filter(Boolean).slice(0,5);
const initials=name=>String(name||"?").split(/[\s.-]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const teamObj=short=>(D?.teams||[]).find(t=>t.team===short)||{};
const playerPhoto=p=>p?.photo_code?`https://resources.premierleague.com/premierleague/photos/players/250x250/p${encodeURIComponent(p.photo_code)}.png`:"";
const badgeUrl=team=>{const t=typeof team==="string"?teamObj(team):team;return t?.code?`https://resources.premierleague.com/premierleague/badges/100/t${encodeURIComponent(t.code)}.png`:""};
const imageFallback=`onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"`;
const avatar=p=>`<span class="avatar">${playerPhoto(p)?`<img src="${playerPhoto(p)}" alt="${e(p?.name||'Player')}" loading="lazy" ${imageFallback}>`:''}<span class="avatar-fallback" style="${playerPhoto(p)?'display:none':'display:grid'}">${e(initials(p?.name))}</span></span>`;
const thumb=p=>`<span class="player-thumb">${playerPhoto(p)?`<img src="${playerPhoto(p)}" alt="${e(p?.name||'Player')}" loading="lazy" ${imageFallback}>`:''}<span class="player-fallback" style="${playerPhoto(p)?'display:none':'display:block'}">${e(initials(p?.name))}</span></span>`;
const clubBadge=team=>{const t=typeof team==="string"?teamObj(team):team,u=badgeUrl(t);return u?`<img class="club-badge" src="${u}" alt="${e(t?.name||t?.team||team)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="badge-fallback" style="display:none">${e(t?.team||team||'?')}</span>`:`<span class="badge-fallback">${e(t?.team||team||'?')}</span>`};
const pmeta=p=>`${e(p.team)} · ${e(p.pos)} · ${money(p.price)} · ${n(p.own).toFixed(1)}% owned`;
const byId=()=>new Map(players().map(p=>[n(p.id),p]));
function deadlineText(){const x=D?.events?.[0];if(!x?.deadline)return{big:"Unavailable",meta:"No current deadline found"};const ms=new Date(x.deadline)-Date.now();if(ms<=0)return{big:`GW${x.gw} closed`,meta:"Deadline has passed"};const h=ms/36e5;return h<24?{big:`${Math.floor(h)}h ${Math.floor(h%1*60)}m`,meta:`until GW${x.gw} deadline`}:{big:`${Math.floor(h/24)}d ${Math.floor(h%24)}h`,meta:`until GW${x.gw} deadline`}}
function relativeTime(iso){if(!iso)return"Unknown";const t=new Date(iso).getTime();if(!Number.isFinite(t))return"Unknown";const h=Math.max(0,(Date.now()-t)/36e5);if(h<1)return`${Math.max(1,Math.round(h*60))}m ago`;if(h<24)return`${Math.round(h)}h ago`;return`${Math.round(h/24)}d ago`}
function fixtureBadge(x,key=fdrKey){const v=n(x?.[key]??x?.fdr,3),s=(D?.fdr_scale||[]).find(a=>n(a.fdr)===v),st=s?`background:${e(s.color)};color:${e(s.text)}`:"";return`<span class="fdr" style="${st}">${e(x.opp)} ${x.h?"H":"A"}</span>`}
function standardTable(list,last,label){return`<div class="table-wrap"><table><thead><tr><th>Player</th><th>Team</th><th>Pos</th><th>Price</th><th>Owned</th><th>GW xPts</th><th>5GW</th><th>${e(label)}</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${e(p.name)}</b></td><td>${e(p.team)}</td><td>${e(p.pos)}</td><td>${money(p.price)}</td><td>${n(p.own).toFixed(1)}%</td><td>${n(p.xpts).toFixed(1)}</td><td>${n(p.projection_total).toFixed(1)}</td><td>${last(p)}</td></tr>`).join("")}</tbody></table></div>`}
function sectionHead(title,sub){return`<div class="section-head"><div><div class="section-title">${e(title)}</div><div class="section-sub">${e(sub)}</div></div></div>`}
function nextFixtures(){const out=[],seen=new Set();for(const t of (D?.teams||[])){const g=t.fixtures?.[0]||[];for(const f of g){if(!f.h)continue;const key=`${t.team}-${f.opp}`;if(seen.has(key))continue;seen.add(key);out.push({home:t.team,away:f.opp,fdr:f.fdr,event:f.event})}}return out.slice(0,10)}
function pickVortexXI(){const q={GKP:1,DEF:3,MID:4,FWD:3},out=[];for(const [pos,count] of Object.entries(q)){out.push(...players().filter(p=>p.pos===pos).sort((a,b)=>n(b.xpts)-n(a.xpts)).slice(0,count))}return out}
function pitchPlayer(p){return`<div class="pitch-player"><div class="pitch-img-wrap">${playerPhoto(p)?`<img class="pitch-img" src="${playerPhoto(p)}" alt="${e(p.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<span class="pitch-fallback" style="${playerPhoto(p)?'display:none':'display:block'}">${e(initials(p.name))}</span></div><div class="pitch-name">${e(p.name)}</div><div class="pitch-score">${n(p.xpts).toFixed(1)} xPts</div></div>`}
function fixturesPanel(){const fx=nextFixtures();return`<div class="fixture-list">${fx.map((x,i)=>`<div class="fixture-row"><span class="fixture-home">${e(teamObj(x.home).name||x.home)}</span>${clubBadge(x.home)}<span class="kickoff">GW${n(D.first_gw)}</span>${clubBadge(x.away)}<span class="fixture-away">${e(teamObj(x.away).name||x.away)}</span></div>`).join('')||'<div class="empty">Fixtures pending refresh.</div>'}</div>`}
function attackPanel(){const ratings=[...(D.ratings||[])].sort((a,b)=>n(b.attack)-n(a.attack)).slice(0,12),max=Math.max(1,...ratings.map(x=>n(x.attack)));return ratings.map((r,i)=>{const t=teamObj(r.team),f=t.fixtures?.[0]?.[0],pct=Math.max(12,Math.round(n(r.attack)/max*100));return`<div class="attack-row"><span>${clubBadge(r.team)}</span><div class="attack-meta"><div class="attack-team">${e(r.team)}</div><div class="attack-fixture">${f?`${e(f.opp)} (${f.h?'H':'A'})`:'fixture pending'}</div></div><div class="attack-bar"><span class="attack-fill" style="width:${pct}%"></span><span class="attack-value">${n(r.attack).toFixed(0)}</span></div></div>`}).join('')}

function transfersPanel(){const list=players().filter(p=>p.price_signal).sort((a,b)=>Math.abs(n(b.price_signal?.score))-Math.abs(n(a.price_signal?.score))).slice(0,10);return`<div class="transfer-list">${list.map(p=>{const s=n(p.price_signal?.score),net=n(p.net);return`<div class="transfer-row">${thumb(p)}<div class="transfer-info"><div class="transfer-name">${e(p.name)}</div><div class="transfer-meta">${e(p.team)} · ${e(p.pos)} · ${money(p.price)}</div></div><span class="${s>=0?'pressure-up':'pressure-down'}">${s>0?'+':''}${s}</span><span class="${net>=0?'net-pos':'net-neg'}">${net>0?'+':''}${Math.round(net/100)/10}k</span></div>`}).join('')||'<div class="empty">Price snapshots are building.</div>'}</div>`}

function playerAnalytics(){const all=players(),stats=[...all].sort((a,b)=>n(b.xpts)-n(a.xpts)).slice(0,30),perGw=[...all].sort((a,b)=>n(b.projection_total)-n(a.projection_total)).slice(0,20),compare=topPlayers().slice(0,5);return`${sectionHead("Player Analytics","Player Statistics · Stats Per GW · Player Comparison")}<div class="subtopics"><span class="subtopic">Player Statistics</span><span class="subtopic">Stats Per GW</span><span class="subtopic">Player Comparison</span></div><div class="grid"><section class="card s12"><div class="label">Player Statistics</div><div class="divider"></div>${standardTable(stats,p=>n(p.form).toFixed(1),'Form')}</section><section class="card s12"><div class="label">Stats Per GW</div><div class="divider"></div>${standardTable(perGw,p=>(p.projections||[]).map(x=>`GW${x.gw} ${n(x.xpts).toFixed(1)}`).join(' · '),'Projection path')}</section><section class="card s12"><div class="label">Player Comparison</div><div class="divider"></div><div class="table-wrap"><table><thead><tr><th>Player</th><th>Club</th><th>Price</th><th>Owned</th><th>Form</th><th>PPG</th><th>GW xPts</th><th>5GW</th></tr></thead><tbody>${compare.map(p=>`<tr><td><div class="player-line">${avatar(p)}<b>${e(p.name)}</b></div></td><td>${e(p.team)}</td><td>${money(p.price)}</td><td>${n(p.own).toFixed(1)}%</td><td>${n(p.form).toFixed(1)}</td><td>${n(p.ppg).toFixed(1)}</td><td>${n(p.xpts).toFixed(1)}</td><td>${n(p.projection_total).toFixed(1)}</td></tr>`).join('')}</tbody></table></div></section></div>`}
function teamStats(){const rows=[...(D.ratings||[])].map(r=>{const t=teamObj(r.team);return{...r,name:t.name||r.team,avg:t.avg}}).sort((a,b)=>n(b.attack)+n(b.defence)-n(a.attack)-n(a.defence));return`${sectionHead("Team Statistics","Vortex attack, defence and upcoming fixture strength for all 20 clubs.")}<div class="table-wrap"><table><thead><tr><th>Club</th><th>Attack index</th><th>Defence index</th><th>Combined</th><th>5GW Avg FDR</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="player-line">${clubBadge(r.team)}<div><b>${e(r.name)}</b><div class="player-meta">${e(r.team)}</div></div></div></td><td>${n(r.attack).toFixed(0)}</td><td>${n(r.defence).toFixed(0)}</td><td><b>${(n(r.attack)+n(r.defence)).toFixed(0)}</b></td><td>${r.avg==null?'—':n(r.avg).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`}

function preseason(){const rows=[...(D.ratings||[])].sort((a,b)=>n(b.attack)+n(b.defence)-n(a.attack)-n(a.defence)).slice(0,10);return`${sectionHead("Preseason","Season baseline and team-strength reference retained for planning context.")}<div class="grid"><section class="card s12"><div class="label">Current model baseline</div><div class="mini-list">${rows.map((r,i)=>`<div class="mini-item"><div class="mini-left">${clubBadge(r.team)}<div><b>${e(teamObj(r.team).name||r.team)}</b><div class="player-meta">Attack ${n(r.attack).toFixed(0)} · Defence ${n(r.defence).toFixed(0)}</div></div></div><span class="chip">#${i+1}</span></div>`).join('')}</div></section></div>`}

function blog(){const cap=topPlayers()[0],fx=[...(D.teams||[])].filter(t=>t.avg!=null).sort((a,b)=>n(a.avg)-n(b.avg))[0],rise=players().filter(p=>p.price_signal).sort((a,b)=>n(b.price_signal.score)-n(a.price_signal.score))[0];return`${sectionHead("FPL Vortex Blog","Automatically generated short-form insight from the current dataset.")}<div class="grid"><section class="card s6"><div class="label">Captain watch</div><div class="player-line" style="margin-top:10px">${avatar(cap)}<div><div class="player-name">${e(cap?.name||'—')}</div><div class="player-meta">${n(cap?.xpts).toFixed(1)} xPts for GW${n(D.first_gw)}</div></div></div></section><section class="card s6"><div class="label">Fixture watch</div><div class="player-line" style="margin-top:10px">${clubBadge(fx?.team)}<div><div class="player-name">${e(fx?.name||fx?.team||'—')}</div><div class="player-meta">${fx?.avg!=null?n(fx.avg).toFixed(2):'—'} average FDR over the tracked horizon</div></div></div></section><section class="card s12"><div class="label">Market watch</div><div class="player-line" style="margin-top:10px">${avatar(rise)}<div><div class="player-name">${e(rise?.name||'—')}</div><div class="player-meta">Price pressure ${rise?.price_signal?`${n(rise.price_signal.score)>0?'+':''}${n(rise.price_signal.score)}`:'pending'} · ${rise?money(rise.price):''}</div></div></div></section></div>`}
function bestXI(s,gw){const q={GKP:[],DEF:[],MID:[],FWD:[]};s.forEach(p=>q[p.pos]?.push(p));Object.values(q).forEach(a=>a.sort((x,y)=>pAt(y,gw)-pAt(x,gw)));let b=null;for(let d=3;d<=5;d++)for(let m=2;m<=5;m++)for(let f=1;f<=3;f++){if(d+m+f!==10||q.GKP.length<1||q.DEF.length<d||q.MID.length<m||q.FWD.length<f)continue;const xi=[q.GKP[0],...q.DEF.slice(0,d),...q.MID.slice(0,m),...q.FWD.slice(0,f)],base=xi.reduce((s,p)=>s+pAt(p,gw),0),cap=[...xi].sort((x,y)=>pAt(y,gw)-pAt(x,gw))[0],total=base+pAt(cap,gw);if(!b||total>b.total)b={xi,cap,total}}if(!b)return{xi:[],cap:null,total:0,bench:0};const ids=new Set(b.xi.map(p=>p.id));return{...b,bench:s.filter(p=>!ids.has(p.id)).reduce((v,p)=>v+pAt(p,gw),0)}}
function pool(pos,score){const a=players().filter(p=>p.pos===pos&&n(p.price)>0).map(p=>({p,s:score(p),v:score(p)/Math.max(3.5,n(p.price))})),m=new Map();[...[...a].sort((x,y)=>y.s-x.s).slice(0,9),...[...a].sort((x,y)=>y.v-x.v).slice(0,8),...[...a].sort((x,y)=>n(x.p.price)-n(y.p.price)).slice(0,6)].forEach(x=>m.set(x.p.id,x));return[...m.values()].sort((x,y)=>y.s-x.s).slice(0,16)}
function combos(pos,count,score){const a=pool(pos,score),out=[];function go(i,left,cost,s,ps,teams){if(!left){out.push({cost,s,ps:[...ps],teams:{...teams}});return}for(let j=i;j<=a.length-left;j++){const x=a[j],team=x.p.team,c=(teams[team]||0)+1;if(c>3)continue;teams[team]=c;ps.push(x.p);go(j+1,left-1,cost+Math.round(n(x.p.price)*10),s+x.s,ps,teams);ps.pop();if(c===1)delete teams[team];else teams[team]=c-1}}go(0,count,0,0,[],{});return out.sort((x,y)=>y.s-x.s).slice(0,650)}
function mergeOK(a,b){return Object.entries(b).every(([t,c])=>(a[t]||0)+c<=3)}
function optimize(score,budget){let states=[{cost:0,s:0,ps:[],teams:{}}];for(const [pos,count] of [["GKP",2],["DEF",5],["MID",5],["FWD",3]]){const cs=combos(pos,count,score),next=[];for(const st of states)for(const c of cs){if(st.cost+c.cost>budget||!mergeOK(st.teams,c.teams))continue;const teams={...st.teams};Object.entries(c.teams).forEach(([t,v])=>teams[t]=(teams[t]||0)+v);next.push({cost:st.cost+c.cost,s:st.s+c.s,ps:[...st.ps,...c.ps],teams})}states=next.sort((x,y)=>y.s-x.s).slice(0,650)}return states[0]?.ps||[]}
function period(s,gs){return gs.reduce((v,g)=>v+bestXI(s,g).total,0)}
function chipName(x){x=String(x||'').toLowerCase();if(x.includes('wildcard'))return'Wildcard';if(x.includes('freehit')||x.includes('free hit'))return'Free Hit';if(x.includes('bboost')||x.includes('bench'))return'Bench Boost';if(x.includes('3xc')||x.includes('triple'))return'Triple Captain';return x}
async function managerFetch(id){const r=await fetch(`/api/manager?entry=${encodeURIComponent(id)}`,{cache:'no-store'});if(!r.ok)throw new Error('My Team Lab needs the local Cloudflare/Wrangler preview or the hosted site. The plain Python preview only serves static files.');return r.json()}
async function analyze(id){const raw=await managerFetch(id),map=byId(),s=(raw.picks?.picks||[]).map(x=>map.get(n(x.element))).filter(Boolean);if(s.length!==15)throw new Error(`Expected 15 squad players, found ${s.length}`);const gs=gws(),selling=(raw.picks?.picks||[]).reduce((v,x)=>v+n(x.selling_price),0),bank=n(raw.picks?.entry_history?.bank,n(raw.summary?.last_deadline_bank)),budget=selling?selling+bank:Math.round(s.reduce((v,p)=>v+n(p.price),0)*10),half=n(D.first_gw)<=19?[1,19]:[20,38],used=new Set((raw.history?.chips||[]).filter(x=>n(x.event)>=half[0]&&n(x.event)<=half[1]).map(x=>chipName(x.name))),available=['Wildcard','Free Hit','Bench Boost','Triple Captain'].filter(x=>!used.has(x)),rows=gs.map(g=>({g,...bestXI(s,g)}));let plans=[];if(available.includes('Bench Boost'))plans.push(rows.reduce((b,x)=>!b||x.bench>b.gain?{chip:'Bench Boost',gw:x.g,gain:x.bench,priority:x.bench,note:`Bench projects ${x.bench.toFixed(1)} points`}:b,null));if(available.includes('Triple Captain'))plans.push(rows.reduce((b,x)=>{const gain=pAt(x.cap,x.g);return!b||gain>b.gain?{chip:'Triple Captain',gw:x.g,gain,priority:gain,note:`${x.cap?.name||'Captain'} adds ${gain.toFixed(1)} points`}:b},null));if(available.includes('Free Hit'))for(const g of gs){if(g===1||(g>1&&(raw.history?.chips||[]).some(x=>n(x.event)===g-1&&chipName(x.name)==='Free Hit')))continue;const opt=optimize(p=>pAt(p,g),budget),gain=bestXI(opt,g).total-bestXI(s,g).total;if(!plans.find(x=>x.chip==='Free Hit')||gain>plans.find(x=>x.chip==='Free Hit').gain)plans=plans.filter(x=>x.chip!=='Free Hit').concat({chip:'Free Hit',gw:g,gain,priority:gain,note:'Optimized single-GW squad versus current squad'})}if(available.includes('Wildcard'))for(let i=0;i<gs.length;i++){const win=gs.slice(i),opt=optimize(p=>win.reduce((v,g)=>v+pAt(p,g),0),budget),gain=period(opt,win)-period(s,win),priority=gain/win.length;if(!plans.find(x=>x.chip==='Wildcard')||priority>plans.find(x=>x.chip==='Wildcard').priority)plans=plans.filter(x=>x.chip!=='Wildcard').concat({chip:'Wildcard',gw:gs[i],gain,priority,note:`${win.length}-GW optimized squad versus holding`})}return{raw,s,budget,available,used:[...used],rows,plans:plans.filter(Boolean).sort((a,b)=>n(b.priority)-n(a.priority))}}
function manager(){if(!M)return`${sectionHead("My Team Lab","Enter your public FPL Team ID. No FPL password is required.")}<div class="grid"><section class="card s6"><div class="label">Personalized squad analysis</div><div class="player-name" style="margin-top:8px">Analyze your 15-player squad</div><div class="muted" style="margin-top:6px">Loads your squad, budget and chip history, then compares upcoming chip and team scenarios.</div><div class="input-row"><input id="entry" inputmode="numeric" placeholder="FPL Team ID" value="${e(localStorage.getItem('fplVortexEntry')||'')}"><button class="btn primary" id="run">Analyze team</button></div></section><section class="card s6"><div class="label">Local review note</div><div class="player-name" style="margin-top:8px">Local review API enabled</div><div class="muted" style="margin-top:6px">Run python3 scripts/review_server.py so My Team Lab can load your public FPL squad locally without deployment.</div></section></div>`;if(M.loading)return`<div class="empty">Running squad simulations…</div>`;if(M.error)return`<div class="empty"><b>Could not analyze team.</b><br><br>${e(M.error)}<br><br><button class="btn" id="reset">Try another ID</button></div>`;const r=M.result,s=r.raw.summary||{};return`${sectionHead(s.name||"My Team","Personalized squad projections and chip opportunities.")}<div class="grid"><section class="card s12"><div class="row mobile-stack"><div><div class="label">Manager</div><div class="player-name">${e(s.player_first_name||'')} ${e(s.player_last_name||'')}</div></div><button class="btn" id="reset">Change team</button></div><div class="chips" style="margin-top:12px"><span class="chip">Budget ${(r.budget/10).toFixed(1)}m</span><span class="chip green">Available: ${e(r.available.join(', ')||'none')}</span></div></section>${r.plans.map((x,i)=>`<section class="card"><div class="label">${i===0?'Highest normalized edge':e(x.chip)}</div><div class="metric">GW${x.gw} · +${Math.max(0,n(x.gain)).toFixed(1)}</div><div class="muted">${e(x.note)}</div></section>`).join('')}<section class="card s12"><div class="label">Current squad projections</div><div class="divider"></div><div class="table-wrap"><table><thead><tr><th>GW</th><th>XI + captain</th><th>Bench</th><th>Captain</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>GW${x.g}</td><td>${n(x.total).toFixed(1)}</td><td>${n(x.bench).toFixed(1)}</td><td>${e(x.cap?.name||'—')}</td></tr>`).join('')}</tbody></table></div></section></div>`}
function data(){const q=D.quality||{};return`${sectionHead("Data quality","A transparent view of what is official, modeled and currently available.")}<div class="grid">${[['Official player API',q.official_api_available?'Verified':'Fallback'],['Official fixtures',q.official_fixtures_available?'Verified':'Pending'],['Players',q.players],['Teams',q.teams],['Model matches',q.matches_used],['Price snapshots',D.automation?.price_snapshots||0]].map(x=>`<section class="card"><div class="label">${e(x[0])}</div><div class="metric">${e(x[1])}</div></section>`).join('')}<section class="card s12"><div class="label">Projection method</div><div class="divider"></div><div><b>Next GW:</b> ${e(D.projection_method?.next_gw||'')}</div><div class="muted" style="margin-top:6px"><b>Future:</b> ${e(D.projection_method?.future_gws||'')}</div></section></div>`}
const V={overview,fixtures,plan,prices,players:playerAnalytics,teams:teamStats,leagues,manager,preseason,tools,blog,captain,transfers,chips,accuracy,data};
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;render();window.scrollTo({top:150,behavior:'smooth'})});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{fdrKey=b.dataset.f;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.go;render();window.scrollTo({top:150,behavior:'smooth'})});const run=$('run');if(run)run.onclick=async()=>{const id=$('entry').value.trim();if(!/^\d+$/.test(id)){M={error:'Enter a numeric FPL Team ID.'};render();return}localStorage.setItem('fplVortexEntry',id);M={loading:true};render();try{M={result:await analyze(id)}}catch(err){M={error:err.message||'Unknown error'}}render()};const reset=$('reset');if(reset)reset.onclick=()=>{M=null;render()}}
function render(){if(!D)return;$('tabs').innerHTML=TABS.map(([k,l,icon,badge])=>`<button class="product-tab" aria-selected="${currentTab===k}" data-tab="${k}"><span class="nav-icon">${icon}</span>${l}${badge?'<span class="new-badge">New</span>':''}</button>`).join('');$('view').innerHTML=(V[currentTab]||overview)();bind()}
async function load(){try{const r=await fetch(`data.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);D=await r.json();$('footerUpdated').textContent=`Updated ${D.generated||'unknown'}`;const age=Date.now()-new Date(D.generated_iso).getTime();if(age>36*36e5)$('notice').innerHTML=`<div class="notice">Dataset is older than 36 hours. Last-known-good data is preserved automatically; check the latest data refresh if this persists.</div>`;render()}catch(err){$('view').innerHTML=`<div class="empty"><b>Could not load data.json.</b><br><br>${e(err.message||'Unknown error')}</div>`}}
load();
